[package]
name = "ytfast"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
description = "A native YouTube Music player for Omarchy, built with Rust and egui"
license = "MIT"
authors = ["Tyler Mayberry"]
repository = "https://github.com/MayberryDT/ytfast"
publish = false

[dependencies]
# UI framework, as in ZapFast and Spotifast. glow avoids the larger wgpu stack.
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "glow", "default_fonts", "wayland", "x11", "persistence"] }
egui = "0.36.2"
# Decodes cover art (JPEG/PNG/WebP) and the SVG icons.
egui_extras = { version = "0.36.2", features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Shared foundation of the ZapFast/Spotifast family (github.com/crmne/fastframe).
# Every crate comes from the same tag; move them together.
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.14.0" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.14.0" }
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.14.0" }
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.14.0" }
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.14.0" }
# Keeps the app (audio, MPRIS) alive between windows: closing the window
# plays on, and the shell recreates the window on demand (src/main.rs).
fastframe-shell = { git = "https://github.com/crmne/fastframe", tag = "v0.14.0" }
anyhow = "1"
httpdate = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
fastrand = "2"
# The backend runtime: InnerTube requests, cover downloads, mpv IPC and yt-dlp.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "net", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "brotli"] }
# MPRIS and desktop notifications over the session bus, served from the
# backend's tokio runtime. The same zbus AccessKit already brings in, with the
# same `async-io` reactor: zbus's `tokio` feature would apply to AccessKit's
# zbus too, and accesskit_unix can't run its D-Bus thread with both.
zbus = { version = "5", default-features = false, features = ["async-io"] }
# The tray icon (StatusNotifierItem) while the window is closed; on the same
# zbus and `async-io` reactor, for the same reason.
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
# Reads the browser's cookie store (a copy; the browser keeps it open).
rusqlite = "0.37"
# Chromium's cookie encryption on Linux: PBKDF2-SHA1 key, AES-128-CBC.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
sha2 = "0.10"

[features]
# The scripted end-to-end run (src/e2e.rs, scripts/e2e.sh). Never in a normal build.
e2e = []

[patch.crates-io]
# Match Spotifast v0.14.2: egui apps-0.36.2, winit apps-0.30,
# and fastframe v0.14.0 move together. No local upstream patches.
ecolor = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
eframe = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui-wgpu = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
emath = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
epaint = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
winit = { git = "https://github.com/crmne/winit", rev = "0bed9dc0a7db02590a279fb8bac795fa39ee6948" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Unwind, not abort: a library's background thread that panics must not take
# the app down. accesskit_unix's D-Bus thread unwraps an error when the
# desktop's AT-SPI bus refuses connections; with unwind
# only that thread ends and ytfast runs without screen-reader support.
panic = "unwind"

# Keep dependencies optimized in development so audio and layout are usable;
# the application crate itself stays incremental.
[profile.dev.package."*"]
opt-level = 2
